[build-system]
requires = ["setuptools>=45"]
build-backend = "setuptools.build_meta"

[project]
name = "rabbit-deterrent"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.28",
    # numpy, opencv, and pygame have no armv6l wheels.
    # On the Pi Zero W they come from apt (python3-numpy, python3-opencv, python3-pygame).
    # The venv is created with --system-site-packages so they are importable.
]

[project.optional-dependencies]
pi = [
    "picamera2",
]
server = [
    "transformers>=4.39.0,<4.46.0",
    "accelerate>=0.28.0",
    "einops>=0.7.0",
    "pyvips>=2.2.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    "Pillow>=10.0.0",
    "torch>=2.2.0",
    "opencv-python-headless>=4.8.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
]
training = [
    "ultralytics>=8.0.0",
    "roboflow>=1.1.0",
    "torch>=2.0.0",
    "onnx>=1.14.0",
    "matplotlib>=3.7.0",
]

[project.scripts]
rabbit-detect = "rabbit_deterrent.main:main"

[tool.setuptools.packages.find]
where = ["src"]
