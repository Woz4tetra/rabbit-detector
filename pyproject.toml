[build-system]
requires = ["setuptools>=45"]
build-backend = "setuptools.build_meta"

[project]
name = "rabbit-deterrent"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.28",
    # numpy, opencv, and pygame have no armv6l wheels.
    # On the Pi Zero W they come from apt (python3-numpy, python3-opencv, python3-pygame).
    # The venv is created with --system-site-packages so they are importable.
]

[project.optional-dependencies]
pi = [
    "picamera2",
]
training = [
    "ultralytics>=8.0.0",
    "roboflow>=1.1.0",
    "torch>=2.0.0",
    "onnx>=1.14.0",
    "matplotlib>=3.7.0",
]

[project.scripts]
rabbit-detect = "rabbit_deterrent.main:main"

[tool.setuptools.packages.find]
where = ["src"]
