[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "rabbit-deterrent"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.28",
    "numpy>=1.23.0,<2.0.0",
    "onnxruntime>=1.16.0",
    "opencv-python-headless>=4.5.0",
    "pygame>=2.5.0",
]

[project.optional-dependencies]
pi = [
    "picamera2",
]
training = [
    "ultralytics>=8.0.0",
    "roboflow>=1.1.0",
    "torch>=2.0.0",
    "onnx>=1.14.0",
    "matplotlib>=3.7.0",
]

[project.scripts]
rabbit-detect = "rabbit_deterrent.main:main"

[tool.setuptools.packages.find]
where = ["src"]
